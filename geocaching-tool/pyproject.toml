[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gctool"
version = "1.0.0"
description = "Backup, delete and restore geocaching.com bookmark lists and pocket queries via the browser session cookie."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28",
    "beautifulsoup4>=4.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "responses>=0.23",
]

[project.scripts]
gctool = "gctool.cli:main"

[tool.setuptools]
packages = ["gctool"]

[tool.pytest.ini_options]
testpaths = ["tests"]
